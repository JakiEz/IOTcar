# Cement Truck Monitor — local infrastructure
#
# Start:   docker compose up -d --build     (--build the first time, and after editing node-red/Dockerfile)
# Stop:    docker compose down              (data is kept in the named volume)
# Reset:   docker compose down -v           (deletes MySQL data; schema re-applies on next start)
#
# Reads MYSQL_ROOT_PASSWORD from a ".env" file in this folder (git-ignored).
#
# Ports on your machine (all shifted to avoid the hospital project, which uses
# 3307 MySQL / 1883 MQTT / 18083 EMQX dashboard / 1880 Node-RED):
#   3308   MySQL          (3306 = local MySQL80 install)
#   1884   EMQX MQTT      <- the ESP32 connects here
#   18084  EMQX dashboard (login admin / public)
#   1881   Node-RED editor
#
# NOTE: these are HOST ports only. Inside the compose network the containers
# still talk on their standard ports (emqx:1883, mysql:3306), which is why the
# Node-RED flow needs no changes.

services:
  mysql:
    image: mysql:8.0
    container_name: cmt-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - cmt-mysql-data:/var/lib/mysql
      # any .sql here runs ONCE, on first start with an empty volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:6.3
    container_name: cmt-emqx
    restart: unless-stopped
    ports:
      - "1884:1883"     # MQTT — the ESP32 (and Node-RED test publisher) connect here
      - "18084:18083"   # web dashboard
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  nodered:
    build: ./node-red            # see node-red/Dockerfile (adds the MySQL node)
    container_name: cmt-nodered
    restart: unless-stopped
    ports:
      - "1881:1880"
    environment:
      TZ: Asia/Bangkok
    volumes:
      # flows, credentials and installed extras live here so they survive restarts
      - ./node-red/data:/data
    depends_on:
      mysql:
        condition: service_healthy
      emqx:
        condition: service_healthy

volumes:
  cmt-mysql-data:
