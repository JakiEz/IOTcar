server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback — any unknown path serves index.html
    location / { try_files $uri $uri/ /index.html; }

    # REST API -> Go backend. "backend" is the compose service name; containers
    # reach each other by service name on the compose network, not localhost.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket -> Go backend. The Upgrade/Connection headers are REQUIRED —
    # without them nginx serves it as a plain HTTP request and the socket
    # silently fails to connect (a very easy thing to forget).
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
